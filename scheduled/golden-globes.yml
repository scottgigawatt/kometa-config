#
# golden-globes.yml: Build Golden Globe winners from IMDb ceremony records.
#

#
# Reuse Kometa's award artwork and shared presentation in collection section 130.
#
external_templates:
  default: templates
  template_variables:
    collection_section: "130"

templates:

  #
  # Synchronize the all-time film winners from January 1 through April 1.
  #
  globe_award_winner:
    sort_title: "!130_<<collection_name>>"
    collection_order: release.desc
    sync_mode: sync
    schedule: range(01/01-04/01)

  #
  # Select movie winners for each ceremony, including films released in earlier years.
  #
  globe_award_winner_dynamic:
    summary: "Golden Globe-winning films with bold stories, memorable performances, and a little red-carpet shine. 🏆"
    sort_title: "!130_<<collection_name>>"
    run_definition: movie
    imdb_award:
      event_id: ev0000292  # Golden Globes, USA
      event_year: <<key>>
      winning: true
    schedule: range(01/01-04/01)

collections:
  Golden Globes Best Picture Winners:
    summary: "Golden Globe-winning dramas, comedies, musicals, and animated adventures with a little extra shine. 🏆"
    variables:
      key: best_picture
    template:
      - name: shared
        sort: Golden Globe !1
        allowed_libraries: movie
        image: award/golden/best_picture_winner
        translation_key: golden_picture
      - name: arr
      - name: custom
        collection_order: release.desc
      - name: globe_award_winner
    delete_collections_named:
      - Golden Globe Best Motion Pictures
    imdb_award:
      event_id: ev0000292  # Golden Globes, USA
      event_year: all
      winning: true

      #
      # Include historical category names for drama, comedy, musical, and animation.
      # Foreign-language and television awards remain separate categories.
      #
      category_filter:
        - best picture
        - best motion picture - drama
        - best motion picture - comedy
        - best motion picture - musical
        - best motion picture - comedy or musical
        - best motion picture - musical or comedy
        - best motion picture, musical or comedy
        - best animated feature film
        - best animated film
        - best motion picture - animated

  Golden Globes Best Director Winners:
    summary: "Films whose directors earned a Golden Globe, from bold visions to moments that linger long after the credits. 🎬"
    variables:
      key: best_director
    template:
      - name: shared
        sort: Golden Globe !2
        allowed_libraries: movie
        image: award/golden/best_director_winner
        translation_key: golden_director
      - name: arr
      - name: custom
      - name: globe_award_winner
    imdb_award:
      event_id: ev0000292  # Golden Globes, USA
      event_year: all
      winning: true

      #
      # Both names refer to the film directing award across its history.
      #
      category_filter:
        - best director
        - best director - motion picture

dynamic_collections:

  #
  # Use six ceremonies from Kometa's validated event-year index.
  #
  Golden Globe Awards:
    type: imdb_awards
    sync: true
    data:
      event_id: ev0000292  # Golden Globes, USA
      starting: latest-5
      ending: latest
    title_format: Golden Globe <<key_name>>
    template:
      - globe_award_winner_dynamic
      - use_year_collections
      - shared
      - arr
      - custom
    template_variables:
      image:
        default: award/golden/winner/<<key>>
      translation_key:
        default: golden_year
      dynamic:
        default: true
