#
# emmy-awards.yml: Build Emmy-winning shows from IMDb ceremony records.
#

#
# Reuse Kometa's award artwork and shared presentation in collection section 130.
#
external_templates:
  default: templates
  template_variables:
    collection_section: 130

templates:

  #
  # Restrict the ceremony builder to shows; a show's premiere year does not limit its wins.
  #
  emmy_award_winner:
    summary: "Emmy-winning television with compelling characters, ambitious storytelling, and plenty of reasons for one more episode. 🏆"
    sort_title: "!130_<<collection_name>>"
    run_definition: show
    imdb_award:
      event_id: ev0000223  # Primetime Emmy Awards
      event_year: <<key>>
      winning: true

    #
    # Refresh after the weekend and retain collections between weekly runs.
    # Override the TV library's scheduled-deletion setting explicitly.
    #
    schedule: weekly(monday)
    delete_not_scheduled: false

dynamic_collections:

  #
  # Use six validated ceremonies, including wins by shows that premiered earlier.
  #
  Emmys:
    type: imdb_awards
    sync: true
    data:
      event_id: ev0000223  # Primetime Emmy Awards
      starting: latest-5
      ending: latest
    title_format: Emmys <<key_name>>
    template:
      - emmy_award_winner
      - use_year_collections
      - shared
      - arr
      - custom
    template_variables:
      image:
        default: award/emmys/winner/<<key>>
      translation_key:
        default: emmy_year
      dynamic:
        default: true
