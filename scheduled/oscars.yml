#
# oscars.yml: Build Oscar winners from IMDb ceremony records.
#

external_templates:
  default: templates
  template_variables:
    collection_section: "130"

templates:
  oscar_award_winner:
    sort_title: "!130_<<collection_name>>"
    collection_order: release.desc
    sync_mode: sync
    schedule: range(01/01-04/01)

  oscar_award_winner_dynamic:
    summary: "Oscar-winning films where unforgettable performances and ambitious visions earn their golden moment. 🏆"
    sort_title: "!130_<<collection_name>>"
    run_definition: movie
    imdb_award:
      event_id: ev0000003  # Academy Awards, USA
      event_year: <<key>>
      winning: true
    schedule: range(01/01-04/01)

collections:
  Oscars Best Picture Winners:
    summary: "Best Picture winners with unforgettable stories, ambitious visions, and a golden place in Oscar history. 🏆"
    variables:
      key: best_picture
    template:
      - name: shared
        sort: Oscars !1
        allowed_libraries: movie
        image: award/oscars/best_picture_winner
        translation_key: oscars_picture
      - name: arr
      - name: custom
      - name: oscar_award_winner
    imdb_award:
      event_id: ev0000003  # Academy Awards, USA
      event_year: all
      winning: true

      #
      # Follow the main picture award across its historical category names.
      # The separate Unique and Artistic Picture award is not Best Picture.
      #
      category_filter:
        - best picture, production
        - best picture
        - best motion picture of the year

  Oscars Best Director Winners:
    summary: "Oscar-winning direction turns performances, images, and ideas into something worth talking about after the lights come up. 🎬"
    variables:
      key: best_director
    template:
      - name: shared
        sort: Oscars !2
        allowed_libraries: movie
        image: award/oscars/best_director_winner
        translation_key: oscars_director
      - name: arr
      - name: custom
      - name: oscar_award_winner
    imdb_award:
      event_id: ev0000003  # Academy Awards, USA
      event_year: all
      winning: true

      #
      # Include the first ceremony's separate comedy and drama directing awards.
      #
      category_filter:
        - best director, comedy picture
        - best director, dramatic picture
        - best director
        - best achievement in directing

dynamic_collections:
  #
  # Use six ceremonies from Kometa's validated event-year index.
  #
  Oscars Winners:
    type: imdb_awards
    sync: true
    data:
      event_id: ev0000003  # Academy Awards, USA
      starting: latest-5
      ending: latest
    title_format: Oscars Winners <<key_name>>
    template:
      - oscar_award_winner_dynamic
      - use_year_collections
      - shared
      - arr
      - custom
    template_variables:
      allowed_libraries:
        default: movie
      image:
        default: award/oscars/winner/<<key>>
      translation_key:
        default: oscars_year
      dynamic:
        default: true
