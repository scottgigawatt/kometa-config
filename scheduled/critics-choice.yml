#
# critics-choice.yml: Build Critics Choice winners from IMDb ceremony records.
#

external_templates:
  default: templates
  template_variables:
    collection_section: "130"

templates:
  choice_award_winner:
    summary: "Critics Choice honorees with memorable performances, bold stories, and a little red-carpet glow. 🏆"
    sort_title: "!130_<<collection_name>>"
    collection_order: release.desc
    sync_mode: sync
    schedule: range(01/01-04/01)

  #
  # Select winners by ceremony year, not by the films' release dates.
  #
  choice_award_year:
    imdb_award:
      event_id: ev0000133  # Critics Choice Awards
      event_year: <<key>>
      winning: true

collections:
  Critics Choice Best Picture Winners:
    template:
      - name: shared
        sort: Critics Choice Awards !1
        allowed_libraries: movie
        image: award/choice/best_picture_winner
        translation_key: choice_best
      - name: arr
      - name: custom
        collection_order: release.desc
      - name: choice_award_winner
    imdb_award:
      event_id: ev0000133  # Critics Choice Awards
      event_year: all
      category_filter: best picture
      winning: true
    summary: "Best Picture honorees from the Critics Choice Awards, where memorable stories get their moment in the spotlight. 🏆"

dynamic_collections:
  #
  # Use six available ceremonies; do not request an unpublished new-year event.
  #
  Critics Choice Awards:
    type: imdb_awards
    sync: true
    data:
      event_id: ev0000133  # Critics Choice Awards
      starting: latest-5
      ending: latest
    title_format: Critics Choice Awards <<key_name>>
    template:
      - choice_award_winner
      - use_year_collections
      - choice_award_year
      - shared
      - arr
      - custom
    template_variables:
      image:
        default: award/choice/<<key>>
      translation_key:
        default: choice_year
      dynamic:
        default: true
