# .markdownlint-cli2.yaml: Markdown style and file selection for repository
#                          documentation and guidance.
#

#
# Check every project-owned Markdown document while excluding Git-owned files.
# Markdownlint CLI2 uses a leading hash to negate matching glob patterns.
#
globs:
  - "**/*.md"
  - "#.git/**"

#
# Honor repository ignore rules so generated and local-only content stays out.
#
gitignore: true

#
# Start with the complete standard rule set, then document only intentional
# exceptions required by the established repository content.
#
config:
  default: true
  line-length: false
  no-inline-html: false
  first-line-h1: false
  code-block-style: false
  table-column-style: false

  #
  # Repeated section names are acceptable when they belong to separate topics.
  #
  no-duplicate-heading:
    siblings_only: true
