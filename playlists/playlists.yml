#
# playlists.yml: Mixed-media playlists that require explicit episode ordering.
#

#
# Preserve Battlestar Galactica's chronological movie and episode sequence.
#
playlists:
  Battlestar Galactica (Timeline Order):
    sync_mode: sync
    libraries: Movies, TV Shows
    sync_to_users: all
    file_poster: "config/assets/posters/playlist/Battlestar Galactica (Timeline Order).png"
    trakt_list: https://trakt.tv/users/markmckee/lists/battlestar-galactica-chrono-order
    summary: Battlestar Galactica in chronological order.
