# config.yml: Isolated configuration for the upstream Plex fixture libraries.
#

libraries:
  test_movie_lib:
    collection_files:
      - file: /workspace/tests/kometa/collections.yml
    overlay_files:
      - default: resolution
      - default: audio_codec
      - default: mediastinger
    operations:
      assets_for_all: false

  test_tv_lib:
    collection_files:
      - file: /workspace/tests/kometa/collections.yml
    overlay_files:
      - default: network
      - default: streaming
      - default: studio
    operations:
      assets_for_all: false

settings:
  cache: true
  cache_expiration: 60
  asset_directory: /workspace/assets
  asset_folders: false
  prioritize_assets: false
  download_url_assets: false
  sync_mode: sync
  minimum_items: 1
  delete_below_minimum: false
  delete_not_scheduled: false
  save_report: true
  show_unmanaged: false
  show_unconfigured: false
  playlist_report: false
  verify_ssl: true
  run_order:
    - collections
    - overlays

plex:
  url: <<plexurl>>
  token: <<plextoken>>
  timeout: 60
  clean_bundles: false
  empty_trash: false
  optimize: false

tmdb:
  apikey: <<tmdbapikey>>
  language: en
  cache_expiration: 60
  region: US
