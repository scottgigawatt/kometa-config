# smoke-collections.yml: Non-destructive smoke collection for both Plex fixtures.
#

collections:

  #
  # Check search and sync using comedies released from 2012 onward.
  # Keep the result off home and shared surfaces without changing other collections.
  #
  Kometa Smoke Test - Recent Comedies:
    plex_search:
      all:
        genre: Comedy
        year.gte: 2012
    collection_mode: hide
    collection_order: alpha
    sync_mode: sync
    visible_home: false
    visible_library: false
    visible_shared: false
