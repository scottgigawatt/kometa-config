#
# collections-config.yml: Collection-only preview with no external list writers.
#

libraries:
  #
  # Load safe movie sources without production charts or external list writers.
  #
  test_movie_lib:
    collection_files:
      - file: /workspace/movies/franchise.yml
      - file: /workspace/movies/genre.yml
      - file: /workspace/movies/subgenre-top.yml
      - file: /workspace/movies/cities.yml
      - file: /workspace/movies/universes.yml

      #
      # Load the guarded runtime copy with no Radarr attributes or scheduled deletion.
      #
      - file: /config/seasonal.yml
      - file: /workspace/tests/kometa/collections.yml

  #
  # Preview the same curated TV collections without loading other TV files.
  #
  test_tv_lib:
    collection_files:
      - file: /workspace/shows/shuffle.yml

      #
      # Preview individual holiday episodes without Sonarr or scheduled deletion.
      #
      - file: /config/tv-seasonal.yml
      - file: /workspace/tests/kometa/collections.yml

#
# Preview collections without deleting unrelated collections or updating media.
# No overlay, playlist, download-client, or library-operation files are loaded.
#
settings:
  cache: true
  cache_expiration: 60
  asset_directory: /config/assets
  asset_folders: false
  prioritize_assets: false
  download_url_assets: false
  sync_mode: sync
  minimum_items: 1
  delete_below_minimum: false
  delete_not_scheduled: false
  save_report: true
  show_unmanaged: false
  show_unconfigured: false
  playlist_report: false
  verify_ssl: true
  run_order:
    - collections

#
# Resolve private values from the ignored test environment, never from source.
#
plex:
  url: <<plexurl>>
  token: <<plextoken>>
  timeout: 60
  clean_bundles: false
  empty_trash: false
  optimize: false

#
# Resolve TMDb metadata for the native collection builders using a private key.
#
tmdb:
  apikey: <<tmdbapikey>>
  language: en
  cache_expiration: 60
  region: US
