#
# config.yml: Configure libraries, shared services, overlays, and playlists.
#

#
# Separate seasonal movie runs from regular movie and TV processing.
#
libraries:

  #
  # Reuse the Movies library for seasonal collections with separate reporting.
  #
  Scheduled:

    #
    # Target the existing Movies library, not a separate Plex library.
    #
    library_name: Movies

    #
    # Keep seasonal missing-item reports separate from ordinary movie reports.
    #
    report_path: config/missing/scheduled-report.yml

    #
    # Hide separator collections between award and holiday groups.
    #
    template_variables:
      use_separator: false

    #
    # Load local awards and holidays alongside the previous year's highlights.
    #
    collection_files:

      #
      # Load the scheduled definitions; each file controls its eligible media type.
      #
      - folder: /config/scheduled/

      #
      # Show the previous year's 50 highest critic-rated movies during awards season.
      #
      - default: year
        template_variables:
          limit: 50
          sort_by: critic_rating.desc
          data:
            starting: current_year-1
            ending: current_year-1
          summary_format: "Standout stories and memorable performances from <<key>>. A year worth another look. 🎞️"
          collection_section: "010"
          schedule: range(01/01-04/01)

    #
    # Remove out-of-season collections without removing their media from Plex.
    #
    settings:
      delete_not_scheduled: true
      asset_directory: config/assets

  #
  # Build regular movie collections and maintain their metadata and custom artwork.
  #
  Movies:

    #
    # Record missing matches without enabling automatic downloads globally.
    #
    report_path: config/missing/movies-report.yml

    #
    # Hide separator collections while retaining each group's sort order.
    #
    template_variables:
      use_separator: false

    #
    # Combine local rules with selected Kometa Defaults.
    #
    collection_files:

      #
      # Keep custom membership rules and presentation in the movie source files.
      #
      - folder: config/movies/

      #
      # Load Neo's movie history and size collections after generation completes.
      #
      - folder: config/generated/pattrmm/movies/

      #
      # Group movies by their available US content ratings.
      #
      - default: content_rating_us

      #
      # Refresh adaptation and true-story collections during Sunday's morning window.
      #
      - default: based
        template_variables:
          summary_true_story: Films based on or inspired by a true story.
          summary_book: Films based on or inspired by a book.
          summary_video_game: Films based on or inspired by a video game.
          summary_comic: Films based on or inspired by a comic.
          schedule: all[weekly(sunday), hourly(05-07)]

      #
      # Create studio groups only when at least ten matching movies are present.
      #
      - default: studio
        template_variables:
          minimum_items: 10

      #
      # Cap decade highlights at 100 movies, with a smaller 25-movie 1970s selection.
      #
      - default: decade
        template_variables:
          limit: 100
          limit_1970: 25
          summary_format: "The stories, stars, and big-screen ambitions of the <<key>>s. Every decade has its scene-stealers. 🎞️"
          summary_1970: "Bold voices, unforgettable antiheroes, and a decade that rewrote the rules of the big screen. 🎞️"
          minimum_items: 25

      #
      # Build alphabetical genre groups without duplicating the local genre rules.
      #
      - default: genre
        template_variables:
          sort_by: title.asc

          #
          # Let movies/genres.yml own these collection names and membership rules.
          #
          exclude:
            - Horror
            - War
            - Western
            - Spy
            - Sport
          minimum_items: 10

      #
      # Include IMDb's top and popular charts without the lowest-rated chart.
      #
      - default: imdb
        template_variables:
          use_lowest: false
          order_top: 3
          order_popular: 3

      #
      # Promote the 50-movie TMDb popular selection on library and shared home screens.
      #
      - default: tmdb
        template_variables:
          limit_popular: 50
          visible_library_popular: true
          visible_home_popular: true
          visible_shared_popular: true

      #
      # Retain the selected Letterboxd lists maintained by Kometa Defaults.
      #
      - default: letterboxd
        template_variables:
          use_imdb_top_250: true
          use_oscars: true
          use_cannes: true
          visible_library_top_500: true
          visible_home_top_500: true
          visible_shared_top_500: true

          #
          # Exclude unresolved movie records only from these Letterboxd charts.
          # Recheck provider mappings before removing these exclusions.
          #
          ignore_ids:
            - 712168   # Top 250 Black-Directed: unresolved movie record
            - 753972   # Top 250 Black-Directed: unresolved movie record
            - 1016041  # 1,001 To See Before You Die and Top 250 Black-Directed
            - 1567451  # One Million Watched Club: unresolved movie record

      #
      # Use default holiday rules only where local seasonal files do not own the name.
      #
      - default: seasonal
        template_variables:
          emoji: ""
          schedule_independence: range(06/28-07/05)
          schedule_labor: range(09/01-09/05)
          schedule_thanksgiving: range(11/01-11/24)
          schedule_veteran: range(11/01-11/12)
          imdb_list_veteran: https://www.imdb.com/list/ls561621160/

          #
          # Let scheduled/holiday-movies.yml own these holidays to avoid collisions.
          #
          exclude:
            - christmas
            - easter
            - halloween
            - mother
            - patrick
            - thanksgiving
            - valentine
            - years

      #
      # Build two 25-movie selections from the last 30 days of Tracearr watch history.
      #
      - default: tracearr
        template_variables:
          collection_section: "020_1"
          list_days: 30
          list_size: 25
          summary_popular: "Big-screen adventures, memorable characters, and stories with plenty of encore appeal. 🍿"
          summary_watched: "Movie-night favorites and stories worth settling in for. Pass the popcorn. 🍿"
          name_popular: Plex Popular
          name_watched: Plex Watched
          use_trending: false
          use_rewatched: false
          use_completed: false
          use_binged: false
          use_transcoded: false

      #
      # Use default universe groups, including the DC Extended Universe.
      #
      - default: universe
        template_variables:
          collection_section: "106"
          minimum_items: 3

          #
          # Use the local DC poster because the upstream DCEU image is unavailable.
          #
          file_poster_dceu: /config/assets/posters/franchise/DC Universe.jpg
          append_data:
            star: Star Wars Saga

          #
          # Exclude locally owned groups and the separate rebooted DC Universe.
          # The default dceu group owns the DC Extended Universe collection.
          #
          exclude:
            - marvel
            - mcu
            - dcu
            - trek
            - avp
            - xmen

      #
      # Publish the weekly piracy chart with an explicit Radarr add-and-search override.
      #
      - default: other_chart
        template_variables:
          visible_library_pirated: true
          visible_home_pirated: true
          visible_shared_pirated: true

          #
          # Add missing weekly chart movies to Radarr and search for downloads.
          # Keep other charts on the global download-client defaults.
          #
          radarr_add_missing_pirated: true
          radarr_search_pirated: true

          use_anidb: false
          use_commonsense: false
          use_stevenlu: false

    #
    # Apply the full custom movie artwork set during the morning overlay window.
    # Full-poster graphics use a transparent 1000-by-1500 canvas at zero offset.
    #
    schedule_overlays: hourly(05-07)
    remove_overlays: false
    overlay_files:
      - file: config/overlays/chart-award-ribbons.yml
      - file: config/overlays/corner-background.yml
      - default: mediastinger
        template_variables:
          file: config/overlays/bottom-left/mediastinger-bottom-left.png
          vertical_align: bottom
          vertical_offset: 0
          horizontal_align: right
          horizontal_offset: 0
          back_width: 1000
          back_height: 1500
          back_color: "#0000"
      - default: resolution
        template_variables:
          file: config/overlays/resolution-top-left-45deg/<<overlay_name>>.png
          horizontal_align: left
          horizontal_offset: 0
          vertical_offset: 0
          vertical_align: top
          final_horizontal_offset: 0
          final_vertical_offset: 0
          back_width: 1000
          back_height: 1500
          back_color: "#0000"

          #
          # Keep the base resolution badge when no matching custom variant exists.
          #
          use_hlg: false
          use_openmatte: false
          use_producers: false
      - default: audio_codec
        template_variables:
          file: config/overlays/audio-top-left-45deg/<<key>>.png
          horizontal_align: left
          horizontal_offset: 0
          vertical_offset: 0
          vertical_align: top
          back_width: 1000
          back_height: 1500
          back_color: "#0000"

    #
    # Suppress missing movie artwork notices while retaining other missing-item reports.
    #
    settings:
      show_missing_assets: false

    #
    # Refresh genres, provider ratings, and movie assets without changing personal ratings.
    # Run only on Monday, Thursday, or Saturday between 05:00 and 07:59.
    #
    operations:
      - schedule: all[weekly(monday|thursday|saturday), hourly(05-07)]
        mass_genre_update: tmdb
        mass_audience_rating_update: imdb
        mass_critic_rating_update: mdb_tomatoes
        assets_for_all: true

  #
  # Build show collections and maintain series metadata and custom corner artwork.
  #
  TV Shows:

    #
    # Keep missing show matches separate from movie reports.
    #
    report_path: config/missing/tv-shows-report.yml

    #
    # Hide separator collections while retaining each group's sort order.
    #
    template_variables:
      use_separator: false

    #
    # Combine local show rules and Emmy winners with selected Kometa Defaults.
    #
    collection_files:

      #
      # Load custom networks, episode themes, and show-only shuffle collections.
      #
      - folder: config/shows/

      #
      # Load Neo's TV history and returning-soon collections without generated overlays.
      #
      - folder: config/generated/pattrmm/shows/

      #
      # Keep Emmy winners available year-round with their own Monday refresh schedule.
      #
      - file: config/scheduled/emmy-awards.yml

      #
      # Group shows by their available US content ratings.
      #
      - default: content_rating_us

      #
      # Require ten shows per studio and leave HBO to shows/networks.yml.
      #
      - default: studio
        template_variables:
          minimum_items: 10
          exclude:
            - HBO

      #
      # Use Kometa's default TV franchise definitions.
      #
      - default: franchise

      #
      # Keep genre groups alphabetical and require at least two matching shows.
      #
      - default: genre
        template_variables:
          sort_by: title.asc
          minimum_items: 2

      #
      # Include IMDb's top and popular charts without the lowest-rated chart.
      #
      - default: imdb
        template_variables:
          use_lowest: false
          order_top: 3
          order_popular: 3

      #
      # Promote the 50-show TMDb popular selection on library and shared home screens.
      #
      - default: tmdb
        template_variables:
          limit_popular: 50
          visible_library_popular: true
          visible_home_popular: true
          visible_shared_popular: true

      #
      # Build two 25-show selections from the last 30 days of Tracearr watch history.
      #
      - default: tracearr
        template_variables:
          list_days: 30
          list_size: 25
          summary_popular: "Compelling characters, unfolding stories, and cliffhangers that make bedtime negotiable. 📺"
          summary_watched: "Familiar faces and ongoing adventures that keep one more episode sounding like a reasonable plan. 📺"
          collection_section: "020_1"
          name_popular: Plex Popular
          name_watched: Plex Watched
          use_trending: false
          use_rewatched: false
          use_completed: false
          use_binged: false
          use_transcoded: false

    #
    # Apply ribbons, series status, and provider artwork together each morning.
    # The generic Plex corner remains when no matching provider graphic is selected.
    #
    schedule_overlays: hourly(05-07)
    remove_overlays: false
    overlay_files:
      - file: config/overlays/chart-award-ribbons.yml
      - file: config/overlays/series-status.yml
      - file: config/overlays/network-fallback.yml
      - default: streaming
        template_variables:
          horizontal_align: left
          horizontal_offset: 0
          vertical_offset: 0
          vertical_align: top
          back_width: 1000
          back_height: 1500
          file: config/overlays/streaming-top-left/<<key>>.png
          back_color: "#0000"

          #
          # Map current provider keys to the existing custom corner artwork.
          #
          file_hbomax: config/overlays/streaming-top-left/max.png
          file_crunchyroll: config/overlays/streaming-top-left/Crunchyroll.png
          file_movistar: config/overlays/network-top-left/Movistar Plus+.png
          file_atresplayer: config/overlays/network-top-left/Atresplayer Premium.png
          file_amc: config/overlays/network-top-left/AMC+.png
          file_discovery: config/overlays/streaming-top-left/discovery+.png
          file_crave: config/overlays/streaming-top-left/Crave.png
          file_now: config/overlays/streaming-top-left/NOW.png
          file_channel4: config/overlays/streaming-top-left/All 4.png
          file_itvx: config/overlays/network-top-left/ITVX.png
          file_bet: config/overlays/network-top-left/BET+.png

          #
          # Disable missing provider graphics; the generic Plex corner remains available.
          #
          use_hayu: false
          use_tubi: false
          use_filmin: false
      - default: studio
        template_variables:
          horizontal_align: left
          horizontal_offset: 0
          vertical_align: top
          vertical_offset: 0
          back_width: 1000
          back_height: 1500
          file: config/overlays/studio-top-left/<<key>>.png
          back_color: "#0000"

          #
          # Reuse the matching corner graphic for this renamed studio.
          #
          file_Max: config/overlays/network-top-left/Max.png

          #
          # Disable missing studio graphics; the generic Plex corner remains available.
          #
          use_Disney Television Animation: false
          use_DisneyToon Studios: false
          use_Dynamic Planning: false
          use_Film4 Productions: false
          use_Golden Harvest: false
          use_Hungry Man: false
          use_Screen Gems: false
          use_Shaw Brothers: false
          use_Studio Live: false
          use_The Stone Quarry: false
      - default: network
        template_variables:
          horizontal_align: left
          horizontal_offset: 0
          vertical_offset: 0
          vertical_align: top
          back_width: 1000
          back_height: 1500
          file: config/overlays/network-top-left/<<key>>.png
          back_color: "#0000"

          #
          # Preserve existing branding while following current network names.
          #
          file_5: config/overlays/network-top-left/Channel 5.png
          file_Apple TV: config/overlays/network-top-left/Apple TV+.png
          file_Atres Player: config/overlays/network-top-left/Atresplayer Premium.png
          file_HBO Max: config/overlays/network-top-left/Max.png
          file_U: config/overlays/network-top-left/UKTV.png
          file_U&Alibi: config/overlays/network-top-left/Alibi.png
          file_U&Dave: config/overlays/network-top-left/Dave.png
          file_U&Eden: config/overlays/network-top-left/Eden.png
          file_U&W: config/overlays/network-top-left/W.png

          #
          # Disable missing network graphics; the generic Plex corner remains available.
          #
          use_tubi: false
          use_U&Drama: false
          use_U&Gold: false
          use_U&Yesterday: false

    #
    # Remove out-of-season TV collections unless their definitions opt out.
    #
    settings:
      delete_not_scheduled: true
      asset_directory: config/assets

    #
    # Refresh show genres and provider ratings in the same window as movie operations.
    #
    operations:
      - schedule: all[weekly(monday|thursday|saturday), hourly(05-07)]
        mass_genre_update: tmdb
        mass_audience_rating_update: imdb
        mass_critic_rating_update: mdb_tomatoes

#
# Combine the custom Battlestar timeline with Kometa's default ordered playlists.
#
playlist_files:
  - file: config/playlists/battlestar-galactica-timeline.yml
  - default: playlist

#
# Set shared defaults; library, template, and collection overrides take precedence.
# Preserve explicit null settings in deployment copies to retain upstream defaults.
#
settings:

  #
  # Cache provider responses to reduce repeated lookups between runs.
  #
  cache: true
  cache_expiration: 30

  #
  # Prefer repository artwork and save downloaded URL assets without creating folders.
  #
  asset_directory: config/assets
  asset_folders: false
  asset_depth: 1
  create_asset_folders: false
  prioritize_assets: true
  dimensional_asset_rename: false
  download_url_assets: true
  show_missing_season_assets: false
  show_missing_episode_assets: false
  show_asset_not_needed: true

  #
  # Append membership by default; rule-based collections explicitly request sync.
  # Delete collections below the minimum, but retain unscheduled ones unless overridden.
  #
  sync_mode: append
  minimum_items: 1
  default_collection_order: null
  delete_below_minimum: true
  delete_not_scheduled: false

  #
  # Report missing matches, including unreleased titles, without verbose item listings.
  #
  run_again_delay: 2
  missing_only_released: false
  only_filter_missing: false
  show_unmanaged: true
  show_filtered: false
  show_options: false
  show_missing: false
  show_missing_assets: true
  save_report: true
  tvdb_language: eng
  item_refresh_delay: 0

  #
  # Report playlist results and synchronize playlists to all eligible Plex users.
  #
  playlist_report: true
  playlist_sync_to_users: all

  #
  # Verify HTTPS certificates and use Kometa's default repository resolution.
  #
  verify_ssl: true
  custom_repo: null

  #
  # Save rendered overlay posters as JPEGs at the selected quality level.
  #
  overlay_artwork_filetype: jpg
  overlay_artwork_quality: 75

  #
  # Keep unconfigured-library notices visible and leave hub sorting at its default.
  #
  show_unconfigured: true
  show_unfiltered: false
  auto_sort_hubs: null
  playlist_exclude_users: null

  #
  # Update metadata before building collections and rendering ratings-dependent artwork.
  #
  run_order:
    - operations
    - metadata
    - collections
    - overlays

#
# Connect to Plex without running database maintenance or emptying the trash.
# All service addresses and credentials below are public placeholders, not deployment values.
#
plex:
  url: http://localhost:32400
  token: abc123
  timeout: 60
  db_cache: 1024
  clean_bundles: false
  empty_trash: false
  optimize: false
  verify_ssl: null

#
# Read viewing activity from Tracearr for the popular and watched collections.
#
tracearr:
  url: http://localhost:3080
  apikey:
  server_id:

#
# Send configured Kometa notifications through Notifiarr.
#
notifiarr:
  apikey: abc123

#
# Leave direct event webhooks unset unless configured privately for the deployment.
#
webhooks:
  error:
  version:
  run_start:
  run_end:
  changes:
  delete:

#
# Use English TMDb metadata and US regional settings for native movie and show builders.
#
tmdb:
  apikey: abc123
  language: en
  cache_expiration: 60
  region: US

#
# Disable automatic Radarr additions, searches, and monitoring changes by default.
# Individual collections may explicitly enable additions and searches.
#
radarr:
  ignore_cache: false
  url: http://localhost:32788
  token: abc123
  add_missing: false
  add_existing: false
  upgrade_existing: false
  monitor_existing: false
  root_folder_path: /movies
  monitor: false
  availability: announced
  quality_profile: HD-1080p
  tag: kometa
  search: false

  #
  # Translate media paths between Radarr's container and the Plex host.
  #
  radarr_path: /movies
  plex_path: /volume1/movies

#
# Disable automatic Sonarr additions, searches, and changes to existing monitoring.
# The all-episodes monitoring policy applies only if a collection enables additions.
#
sonarr:
  ignore_cache: false
  url: http://localhost:32789
  token: abc123
  add_missing: false
  add_existing: false
  upgrade_existing: false
  monitor_existing: false
  root_folder_path: /tv
  monitor: all
  quality_profile: HD-1080p
  language_profile: English
  series_type: standard
  season_folder: true
  tag: kometa
  search: false
  cutoff_search: false

  #
  # Translate media paths between Sonarr's container and the Plex host.
  #
  sonarr_path: /tv
  plex_path: /volume1/tv

#
# Retrieve MDBList ratings, including the Rotten Tomatoes critic scores used by operations.
#
mdblist:
  apikey: abc123
  cache_expiration: 60

#
# Cache OMDb lookups for builders and metadata that require its records.
#
omdb:
  apikey: abc123
  cache_expiration: 60

#
# Authenticate GitHub requests when the deployment supplies a private token.
#
github:
  token: abc123

#
# Keep MyAnimeList authorization separate from the other metadata providers.
#
mal:
  client_id: abc123
  client_secret: abc123
  localhost_url: http://localhost/
  authorization:
    access_token: abc123
    token_type: Bearer
    expires_in: 101010
    refresh_token: abc123
  cache_expiration: 60
