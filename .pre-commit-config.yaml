# .pre-commit-config.yaml: Repository secret, file, Markdown, workflow, shell,
#                          generated-file, and YAML validation hooks.
#

repos:
  # Scan changed content for credentials before it can be committed.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Compare possible secrets against the reviewed repository baseline.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  # Enforce portable syntax and whitespace without rewriting YAML semantics.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
        exclude: ^\.vscode/(?:extensions|settings)\.json$
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: ^assets/
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: ^assets/
      - id: requirements-txt-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
        exclude: ^assets/

  # Validate Markdown structure while preserving the repository's HTML header.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        pass_filenames: false

  # Enforce the two-space YAML style used by Kometa and GitHub Actions.
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args:
          - "--strict"
          - "-d"
          - "{extends: default, rules: {comments: {min-spaces-from-content: 1}, comments-indentation: disable, document-start: disable, indentation: {spaces: 2, indent-sequences: true}, line-length: disable, truthy: disable}}"

  # Validate the repository's GitHub Actions workflow.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # Check project-owned POSIX shell helpers.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # Keep PATTRMM-owned generated YAML out of Git history.
  - repo: local
    hooks:
      - id: check-generated-files
        name: Check generated Kometa files
        entry: scripts/check-generated-files.sh
        language: script
        pass_filenames: false
