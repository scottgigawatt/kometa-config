#
# ratings.yml: Render numeric rating badges with reusable logo templates.
#

#
# Keep this optional numeric-rating layout separate from the main overlay wiring.
#
templates:

  #
  # Pair the IMDb logo with the audience score using equal queue weights.
  #
  imdb_rating:
    optional:
      - overlay_level
    default:
      overlay: <<overlay_name>>
    collection_level: <<overlay_level>>
    overlay:
      name: <<overlay_name>>
      file: https://raw.githubusercontent.com/scottgigawatt/kometa-config/main/overlays/images/<<overlay>>.png
      queue: rating_queue_logo
      weight: <<weight>>

  #
  # Display the Plex audience score beside its matching IMDb logo.
  #
  audience_rating:
    optional:
      - overlay_level
    default:
      rating_type: audience_rating
    collection_level: <<overlay_level>>
    overlay:
      name: text(<<rating_type>>)
      queue: rating_queue_text
      weight: <<weight>>
      font: fonts/Inter-Medium.ttf
      font_size: 63
      font_color: "#FFFFFF"

  #
  # Select the Fresh logo independently from the numeric critic score.
  #
  rt-crit-fresh:
    optional:
      - overlay_level
    default:
      overlay: <<overlay_name>>
    collection_level: <<overlay_level>>
    overlay:
      name: <<overlay_name>>
      file: https://raw.githubusercontent.com/scottgigawatt/kometa-config/main/overlays/images/<<overlay>>.png
      queue: rating_queue_logo
      weight: <<weight>>

  #
  # Use the Rotten logo for the lower critic-rating range.
  #
  rt-crit-rotten:
    optional:
      - overlay_level
    default:
      overlay: <<overlay_name>>
    collection_level: <<overlay_level>>
    overlay:
      name: <<overlay_name>>
      file: https://raw.githubusercontent.com/scottgigawatt/kometa-config/main/overlays/images/<<overlay>>.png
      queue: rating_queue_logo
      weight: <<weight>>

  #
  # Keep the critic text formatting and weight paired with the Rotten Tomatoes logo.
  #
  critic_rating:
    optional:
      - overlay_level
    default:
      rating_type: critic_rating
    collection_level: <<overlay_level>>
    overlay:
      name: text(<<rating_type>>0)
      queue: rating_queue_text
      weight: <<weight>>
      font: fonts/Inter-Medium.ttf
      font_size: 63
      font_color: "#FFFFFF"

#
# Keep two bottom-row positions for logos and their matching score text.
# A named default layout is understood by both Kometa and its editor schema.
#
queues:

  #
  # Higher weights fill the left position first; a second match uses the right position.
  #
  rating_queue_logo:
    default:
      - horizontal_offset: 10
        horizontal_align: left
        vertical_offset: 10
        vertical_align: bottom
      - horizontal_offset: 320
        horizontal_align: left
        vertical_offset: 10
        vertical_align: bottom

  #
  # Offset text from its matching logo while preserving the same weight order.
  #
  rating_queue_text:
    default:
      - horizontal_offset: 189
        horizontal_align: left
        vertical_offset: 41
        vertical_align: bottom
      - horizontal_offset: 499
        horizontal_align: left
        vertical_offset: 41
        vertical_align: bottom

#
# Exclude missing or zero ratings and keep logo and text eligibility synchronized.
#
overlays:

  #
  # Match IMDb audience scores on Plex's 0-to-10 rating scale.
  #
  imdb_rating:
    template:
      - name: imdb_rating
        weight: 80
    plex_search:
      all:
        audience_rating.gte: 0.1
        audience_rating.lte: 10

  #
  # Use the same audience-score range and weight as the IMDb logo.
  #
  audience_rating:
    template:
      name: audience_rating
      weight: 80
    plex_search:
      all:
        audience_rating.gte: 0.1
        audience_rating.lte: 10

  #
  # Choose Fresh artwork for critic scores from 6.1 through 10.
  #
  rt-crit-fresh:
    template:
      - name: rt-crit-fresh
        weight: 90
    plex_search:
      all:
        critic_rating.gte: 6.1
        critic_rating.lte: 10

  #
  # Choose Rotten artwork for critic scores from 0.1 through 6.0.
  #
  rt-crit-rotten:
    template:
      - name: rt-crit-rotten
        weight: 90
    plex_search:
      all:
        critic_rating.gte: 0.1
        critic_rating.lte: 6.0

  #
  # Display critic text in the same queue position as either Rotten Tomatoes logo.
  #
  critic_rating:
    template:
      name: critic_rating
      weight: 90
    plex_search:
      all:
        critic_rating.gte: 0.1
        critic_rating.lte: 10
