#
# chart-award-ribbons.yml: Custom chart and award ribbons for movie and show posters.
#

#
# Share chart sources and ribbon placement while keeping movie and show eligibility separate.
#
templates:

  #
  # Select IMDb's Top 250 chart for the current library type.
  #
  imdb-top-250:
    default:
      overlay: <<overlay_name>>
    imdb_chart: top_<<library_type>>s
    overlay:
      name: <<overlay_name>>
      file: config/overlays/bottom-right/imdb-ribbon.png
      group: logo
      weight: <<weight>>
      horizontal_offset: 0
      horizontal_align: right
      vertical_offset: 0
      vertical_align: bottom

  #
  # Restrict the retained Letterboxd all-time selection to movies.
  #
  letterboxd-1000:
    optional:
      - overlay_level
    run_definition: movie
    collection_level: <<overlay_level>>
    letterboxd_list: https://letterboxd.com/prof_ratigan/list/top-1000-films-of-all-time-calculated/
    overlay:
      name: <<overlay_name>>
      file: config/overlays/bottom-right/letterboxd-ribbon.png
      group: logo
      weight: <<weight>>
      horizontal_offset: 0
      horizontal_align: right
      vertical_offset: 0
      vertical_align: bottom

  #
  # Read Certified Fresh movies from the Kometa-maintained MDBList source.
  #
  rt-cert-fresh-movie:
    optional:
      - overlay_level
    run_definition: movie
    collection_level: <<overlay_level>>
    mdblist_list: https://mdblist.com/lists/k0meta/certifiedfreshmovies
    overlay:
      name: <<overlay_name>>
      file: config/overlays/bottom-right/rotten-ribbon.png
      group: logo
      weight: <<weight>>
      horizontal_offset: 0
      horizontal_align: right
      vertical_offset: 0
      vertical_align: bottom

  #
  # Read Certified Fresh shows from the separate TV source.
  #
  rt-cert-fresh-show:
    optional:
      - overlay_level
    run_definition: show
    collection_level: <<overlay_level>>
    mdblist_list: https://mdblist.com/lists/k0meta/certifiedfreshshows
    overlay:
      name: <<overlay_name>>
      file: config/overlays/bottom-right/rotten-ribbon.png
      group: logo
      weight: <<weight>>
      horizontal_offset: 0
      horizontal_align: right
      vertical_offset: 0
      vertical_align: bottom

  #
  # Read Metacritic Must See movies from the Kometa-maintained MDBList source.
  #
  meta-must-see-movie:
    optional:
      - overlay_level
    run_definition: movie
    collection_level: <<overlay_level>>
    mdblist_list: https://mdblist.com/lists/k0meta/metacriticmustseemovies
    overlay:
      name: <<overlay_name>>
      file: config/overlays/bottom-right/metacritic-ribbon.png
      group: logo
      weight: <<weight>>
      horizontal_offset: 0
      horizontal_align: right
      vertical_offset: 0
      vertical_align: bottom

  #
  # Read Metacritic Must See shows from the separate TV source.
  #
  meta-must-see-show:
    optional:
      - overlay_level
    run_definition: show
    collection_level: <<overlay_level>>
    mdblist_list: https://mdblist.com/lists/k0meta/metacriticmustseeshows
    overlay:
      name: <<overlay_name>>
      file: config/overlays/bottom-right/metacritic-ribbon.png
      group: logo
      weight: <<weight>>
      horizontal_offset: 0
      horizontal_align: right
      vertical_offset: 0
      vertical_align: bottom

  #
  # Match Razzie winners through IMDb's event records instead of a curated list.
  #
  razzie:
    optional:
      - overlay_level
    run_definition: movie
    collection_level: <<overlay_level>>
    imdb_award:
      event_id: ev0000558  # Razzie Awards
      event_year: 1981-current
      winning: true
    overlay:
      name: <<overlay_name>>
      file: config/overlays/bottom-right/razzie-ribbon.png
      group: logo
      weight: <<weight>>
      horizontal_offset: 0
      horizontal_align: right
      vertical_offset: 0
      vertical_align: bottom

  #
  # Restrict IMDb's lowest-rated chart to movies.
  #
  imdb-lowest:
    optional:
      - overlay_level
    run_definition: movie
    collection_level: <<overlay_level>>
    imdb_chart: lowest_rated
    overlay:
      name: <<overlay_name>>
      file: config/overlays/bottom-right/imdb-lowest-ribbon.png
      group: logo
      weight: <<weight>>
      horizontal_offset: 0
      horizontal_align: right
      vertical_offset: 0
      vertical_align: bottom

#
# Select one ribbon from the logo group; the highest matching weight takes precedence.
#
overlays:
  imdb-top-250:
    template:
      - name: imdb-top-250
        weight: 60

  letterboxd-1000:
    template:
      - name: letterboxd-1000
        weight: 50

  mc-must-see-movie:
    template:
      - name: meta-must-see-movie
        weight: 40

  rt-cert-fresh-movie:
    template:
      - name: rt-cert-fresh-movie
        weight: 30

  rt-cert-fresh-show:
    template:
      - name: rt-cert-fresh-show
        weight: 30

  mc-must-see-show:
    template:
      - name: meta-must-see-show
        weight: 40

  razzie:
    template:
      - name: razzie
        weight: 5

  imdb-lowest:
    template:
      - name: imdb-lowest
        weight: 1
