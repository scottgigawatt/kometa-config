#
# network-fallback.yml: Provider corner artwork when no later provider overlay matches.
#

overlays:
  #
  # Keep a generic corner beneath matching streaming, studio, or network art.
  #
  plex:
    overlay:
      name: plex
      file: config/overlays/network-top-left/Plex.png
      group: ICONS
      weight: 100
    plex_all: true

  #
  # Preserve the local Crave corner when Plex supplies that network metadata.
  #
  crave:
    plex_search:
      all:
        network: Crave
    overlay:
      name: crave
      file: config/overlays/network-top-left/Crave.png
