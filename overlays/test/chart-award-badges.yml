#
# chart-award-badges.yml: Keep experimental chart badges separate from live wiring.
#

#
# Keep this alternate badge layout opt-in; the test-library runner uses the main ribbon set.
#
templates:

  #
  # Match the IMDb chart to the library type and share the exclusive logo group.
  #
  imdbtop250:
    default:
      overlay: <<overlay_name>>
    imdb_chart: top_<<library_type>>s
    overlay:
      name: <<overlay_name>>
      file: config/overlays/images/IMDB-Top-250red.png
      group: logo
      weight: <<weight>>
      horizontal_offset: 0
      horizontal_align: right
      vertical_offset: 0
      vertical_align: bottom

  #
  # Read the Certified Fresh movie selection maintained for Kometa on MDBList.
  #
  rt-cert-fresh:
    optional:
      - overlay_level
    collection_level: <<overlay_level>>
    mdblist_list: https://mdblist.com/lists/plexmetamanager/certifiedfreshmovies
    overlay:
      name: <<overlay_name>>
      file: config/overlays/images/RT-Cert-Freshred.png
      group: logo
      weight: <<weight>>
      horizontal_offset: 10
      horizontal_align: right
      vertical_offset: 10
      vertical_align: bottom

  #
  # Read the Metacritic Must See movie selection maintained for Kometa on MDBList.
  #
  meta-must:
    optional:
      - overlay_level
    collection_level: <<overlay_level>>
    mdblist_list: https://mdblist.com/lists/plexmetamanager/metacriticmustseemovies
    overlay:
      name: <<overlay_name>>
      file: config/overlays/images/MC-Must-See.png
      group: logo
      weight: <<weight>>
      horizontal_offset: 10
      horizontal_align: right
      vertical_offset: 10
      vertical_align: bottom

#
# Choose one logo per poster: IMDb first, then Metacritic, then Rotten Tomatoes.
#
overlays:
  imdb-top-250red:
    template:
      - name: imdbtop250
        weight: 50

  rt-cert-freshred:
    template:
      - name: rt-cert-fresh
        weight: 40

  mc-must-see:
    template:
      - name: meta-must
        weight: 45
