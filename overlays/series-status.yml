#
# series-status.yml: Custom status ribbons for TV show posters.
#

#
# Share placement and artwork selection across mutually exclusive status ribbons.
#
templates:

  #
  # The highest weight in the status group wins when more than one rule matches.
  #
  status:
    default:
      overlay: <<overlay_name>>
    run_definition: show
    overlay:
      name: <<overlay_name>>
      file: config/overlays/status-top-left/<<status>>.png
      group: status
      weight: <<weight>>
      horizontal_offset: 0
      horizontal_align: left
      vertical_offset: 0
      vertical_align: top

#
# Prefer currently airing shows over returning, cancelled, and ended states.
#
overlays:

  #
  # Give TMDb's on-the-air selection priority over the broader returning status.
  #
  airing:
    template:
      name: status
      group: status
      weight: 900
      status: airing
    tmdb_on_the_air: 500

  #
  # Treat returning, planned, and in-production shows as active series.
  #
  returning:
    template:
      name: status
      group: status
      weight: 800
      status: returning
    plex_all: true
    filters:
      tmdb_status:
        - returning
        - planned
        - production

  #
  # Mark ended series only when no higher-priority status matches.
  #
  ended:
    template:
      name: status
      group: status
      weight: 600
      status: ended
    plex_all: true
    filters:
      tmdb_status:
        - ended

  #
  # Keep the artwork spelling while matching TMDb's canceled status value.
  #
  cancelled:
    template:
      name: status
      group: status
      weight: 700
      status: cancelled
    plex_all: true
    filters:
      tmdb_status:
        - canceled
