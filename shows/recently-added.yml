#
# recently-added.yml: Separate new episodes from older shows recently added.
#

collections:

  #
  # Select shows with episodes added within 92 days and aired within the last year.
  #
  New TV Show Releases:
    item_label: New Release
    smart_filter:
      sort_by: episode_added.desc
      all:
        episode_added: 92
        episode_air_date: 365
      limit: 250
    summary: "Fresh episodes, unfolding stories, and new reasons to negotiate bedtime. 📺"
    visible_library: true
    visible_home: true
    visible_shared: true
    sort_title: "!008_New_Releases"
    file_poster: config/assets/posters/new-releases/new-tv-show-releases.png

  #
  # Randomize recent additions with older episodes or without the New Release label.
  # The nested any block intentionally allows either condition to qualify a show.
  #
  Old TV Shows Just Added:
    smart_filter:
      sort_by: random
      all:
        episode_added: 30
        any:
          episode_air_date.not: 365
          label.not: New Release
      limit: 250
    summary: "Earlier television adventures, familiar faces, and the dangerous possibility of finding your next long-running obsession. 📺"
    visible_library: true
    visible_home: true
    visible_shared: true
    sort_title: "!009_Old_Shows_Just_Added"
    file_poster: config/assets/posters/new-releases/old-shows-just-added.png
