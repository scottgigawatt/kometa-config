  #
  # Keep the TNG encounters together, including Picard's recovery in Family.
  # Use TVDb aired order, with each two-part story kept complete and consecutive.
  # Sources: https://www.startrek.com/videos/doc-borgvideo-part3
  # https://www.paramountplus.com/shows/star_trek_the_next_generation/episodes/
  # https://thetvdb.com/series/star-trek-the-next-generation/allseasons/official
  #
  "TV Story Arcs: Star Trek — The Borg":
    template:
      name: midnight
      poster: tv-story-arcs-borg
      order: "03"
    builder_level: episode
    collection_order: custom
    summary: "Picard and the Enterprise confront an enemy that erases individuality, then discover the people behind the machinery. From Q's reckless introduction through assimilation, recovery, Hugh, and Lore: the Borg's Next Generation story."
    text:
      - "tvdb_episode:71470_2_16"  # Star Trek: The Next Generation (1987) S02E16 - Q Who?
      - "tvdb_episode:71470_3_26"  # Star Trek: The Next Generation (1987) S03E26 - The Best of Both Worlds (1)
      - "tvdb_episode:71470_4_1"   # Star Trek: The Next Generation (1987) S04E01 - The Best of Both Worlds (2)
      - "tvdb_episode:71470_4_2"   # Star Trek: The Next Generation (1987) S04E02 - Family
      - "tvdb_episode:71470_5_23"  # Star Trek: The Next Generation (1987) S05E23 - I, Borg
      - "tvdb_episode:71470_6_26"  # Star Trek: The Next Generation (1987) S06E26 - Descent (1)
      - "tvdb_episode:71470_7_1"   # Star Trek: The Next Generation (1987) S07E01 - Descent (2)

  #
  # A focused opening arc, not a claim to include the entire X-Files mythology.
  # Preserve both paired investigations: the salvaged aircraft and the Russian experiments.
  # TVDb aired episode numbers were cross-checked against TMDb show 4087.
  # Sources: https://thetvdb.com/series/the-x-files/seasons/official/3
  # https://thetvdb.com/series/the-x-files/seasons/official/4
  #
  "TV Story Arcs: The X-Files — Black Oil Begins":
    template:
      name: midnight
      poster: tv-story-arcs-x-files
      order: "04"
    builder_level: episode
    collection_order: custom
    summary: "A sunken wartime aircraft and a fragment from Siberia open two investigations into a terrifying infection. Mulder, Scully, and Krycek follow the first trails of the black oil, while powerful people work to keep its purpose hidden."
    text:
      - "tvdb_episode:77398_3_15"  # The X-Files (1993) S03E15 - Piper Maru
      - "tvdb_episode:77398_3_16"  # The X-Files (1993) S03E16 - Apocrypha
      - "tvdb_episode:77398_4_8"   # The X-Files (1993) S04E08 - Tunguska
      - "tvdb_episode:77398_4_9"   # The X-Files (1993) S04E09 - Terma
