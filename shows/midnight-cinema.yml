#
# midnight-cinema.yml: Curated miniseries, local episode highlights, and ordered story arcs.
#

#
# Keep the minimum on whole-show definitions; Kometa forbids it for episode collections.
# Episode collections inherit the library minimum instead.
#
templates:
  midnight:
    file_poster: /config/assets/posters/midnight-cinema/<<poster>>.jpg
    sort_title: "!020_2_<<order>>_<<collection_name>>"
    sync_mode: sync
    collection_mode: hide
    visible_library: true
    visible_home: false
    visible_shared: false

collections:

  #
  # Own this selection locally; do not follow a changing third-party list.
  # TMDb /tv/{id} and every regular /season/{number} were checked on 2026-09-23.
  # All entries are ended miniseries with complete episode runtimes totaling <=600 minutes.
  # Totals below sum every regular episode, excluding behind-the-scenes specials.
  # Type and status filters drop any selection subsequently renewed as an ongoing series.
  # Source: https://developer.themoviedb.org/reference/tv-season-details
  #
  Weekend Miniseries:
    template:
      name: midnight
      poster: weekend-miniseries
      order: "01"
    builder_level: show
    minimum_items: 3
    collection_order: alpha
    filters:
      tmdb_type: miniseries
      tmdb_status: ended
    summary: "Complete stories for a weekend: intimate portraits, tangled mysteries, historical reckonings, and extraordinary lives. A beginning, an ending, and time to come up for air."
    tmdb_show:
      - 79299   # A Very English Scandal (2018); 3 episodes, 173 minutes
      - 72615   # Alias Grace (2017); 6 episodes, 276 minutes
      - 11245   # Angels in America (2003); 6 episodes, 375 minutes
      - 155537  # Black Bird (2022); 6 episodes, 360 minutes
      - 87108   # Chernobyl (2019); 5 episodes, 331 minutes
      - 110695  # Dopesick (2021); 8 episodes, 492 minutes
      - 73467   # Godless (2017); 7 episodes, 452 minutes
      - 116174  # It's a Sin (2021); 5 episodes, 233 minutes
      - 81224   # Les Misérables (2018); 6 episodes, 360 minutes
      - 111141  # Maid (2021); 10 episodes, 545 minutes
      - 83605   # Mrs. America (2020); 9 episodes, 447 minutes
      - 61585   # Olive Kitteridge (2014); 4 episodes, 243 minutes
      - 78881   # Picnic at Hanging Rock (2018); 6 episodes, 330 minutes
      - 70453   # Sharp Objects (2018); 8 episodes, 430 minutes
      - 90972   # Station Eleven (2021); 10 episodes, 517 minutes
      - 66276   # The Night Of (2016); 8 episodes, 530 minutes
      - 16997   # The Pacific (2010); 10 episodes, 534 minutes
      - 87739   # The Queen's Gambit (2020); 7 episodes, 395 minutes
      - 91275   # Unbelievable (2019); 8 episodes, 388 minutes
      - 99581   # Unorthodox (2020); 4 episodes, 213 minutes
      - 81355   # When They See Us (2019); 4 episodes, 300 minutes
      - 87104   # Years and Years (2019); 6 episodes, 345 minutes

  #
  # Rank each show's local episodes separately so one fandom cannot fill the collection.
  # episode_critic_rating targets the episode; critic_rating would filter its parent show.
  # Keep five episodes per show at 8.5 or above; absent ratings never qualify.
  # The rating source is whatever Plex already stores; this does not rewrite episode metadata.
  # Empty per-show searches must not abort the first build; they remain visible as warnings.
  # Source: https://kometa.wiki/en/latest/files/builders/plex/search/
  #
  TV's Greatest Episodes:
    template:
      name: midnight
      poster: tvs-greatest-episodes
      order: "02"
    builder_level: episode
    collection_order: critic_rating.desc
    ignore_blank_results: true
    summary: "The beautifully timed joke, the devastating reveal, the hour you immediately want to talk about. Standout episodes across comedy, animation, drama, and science fiction; some surprises are best revisited after the full story."
    plex_search:
      - all:
          title.is: 30 Rock
          episode_critic_rating.gte: 8.5
        sort_by: critic_rating.desc
        limit: 5
      - all:
          title.is: Adventure Time
          episode_critic_rating.gte: 8.5
        sort_by: critic_rating.desc
        limit: 5
      - all:
          any:
            title.is:
              - Battlestar Galactica
              - Battlestar Galactica (2004)
          year.gte: 2004
          year.lte: 2004
          episode_critic_rating.gte: 8.5
        sort_by: critic_rating.desc
        limit: 5
      - all:
          title.is: Better Call Saul
          episode_critic_rating.gte: 8.5
        sort_by: critic_rating.desc
        limit: 5
      - all:
          title.is: Breaking Bad
          episode_critic_rating.gte: 8.5
        sort_by: critic_rating.desc
        limit: 5
      - all:
          title.is: Brooklyn Nine-Nine
          episode_critic_rating.gte: 8.5
        sort_by: critic_rating.desc
        limit: 5
      - all:
          title.is: Friends
          episode_critic_rating.gte: 8.5
        sort_by: critic_rating.desc
        limit: 5
      - all:
          title.is: Mad Men
          episode_critic_rating.gte: 8.5
        sort_by: critic_rating.desc
        limit: 5
      - all:
          title.is: Parks and Recreation
          episode_critic_rating.gte: 8.5
        sort_by: critic_rating.desc
        limit: 5
      - all:
          title.is: Rick and Morty
          episode_critic_rating.gte: 8.5
        sort_by: critic_rating.desc
        limit: 5
      - all:
          title.is: Schitt's Creek
          episode_critic_rating.gte: 8.5
        sort_by: critic_rating.desc
        limit: 5
      - all:
          title.is: Six Feet Under
          episode_critic_rating.gte: 8.5
        sort_by: critic_rating.desc
        limit: 5
      - all:
          title.is: "Star Trek: Deep Space Nine"
          episode_critic_rating.gte: 8.5
        sort_by: critic_rating.desc
        limit: 5
      - all:
          title.is: "Star Trek: The Next Generation"
          episode_critic_rating.gte: 8.5
        sort_by: critic_rating.desc
