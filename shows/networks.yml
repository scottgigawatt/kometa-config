#
# networks.yml: Group shows by TMDb network with local network artwork.
#

templates:

  #
  # Resolve network membership through TMDb and sort matching shows by newly added episodes.
  # Network credits describe a show's broadcasters, not current streaming availability.
  #
  network:
    optional:
      - network
    tmdb_network: <<network>>
    file_poster: /config/assets/posters/networks/<<collection_name>>.png
    sort_title: +2_<<collection_name>>
    sync_mode: sync
    smart_label: episode_added.desc
    summary: "Stories, personalities, and discoveries from <<collection_name>>. 📺"

