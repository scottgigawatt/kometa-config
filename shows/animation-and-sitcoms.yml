#
# animation-and-sitcoms.yml: Curated TV collections with shared artwork for shuffle viewing.
#

#
# Keep curated membership in this repository and match whole series through TMDb.
# Plex includes every available episode of each selected show for shuffle viewing.
#
templates:
  shuffle:
    builder_level: show
    file_poster: /config/assets/posters/playlist/<<collection_name>>.png
    collection_order: alpha
    sync_mode: sync

#
# Give shared TV users the same collection artwork without maintaining duplicate playlists.
#
collections:
  Adult Animation:
    template:
      name: shuffle
    tmdb_show:
      - 60625  # Rick and Morty (2013)
      - 15260  # Adventure Time (2010)
      - 2190   # South Park (1997)
      - 653    # Metalocalypse (2006)
      - 32351  # Ugly Americans (2010)
      - 1434   # Family Guy (1999)
      - 1433   # American Dad! (2005)
      - 539    # Squidbillies (2005)
      - 49008  # Axe Cop (2013)
    summary: "Dysfunctional families, cosmic detours, and cartoon chaos that ranges from whimsical to wildly inappropriate. Animation is not a maturity rating."

  Saturday Morning Cartoons:
    template:
      name: shuffle
    tmdb_show:
      - 888   # Spider-Man (1994)
      - 4574  # X-Men (1992)
      - 2085  # Courage the Cowardly Dog (1999)
      - 2121  # ReBoot (1994)
      - 720   # DuckTales (1987)
      - 926   # Scooby-Doo, Where Are You! (1969)
      - 387   # SpongeBob SquarePants (1999)
      - 4229  # Dexter's Laboratory (1996)
      - 1615  # Chip 'n' Dale Rescue Rangers (1989)
      - 606   # Ed, Edd n Eddy (1999)
      - 1931  # Disney's Adventures of the Gummi Bears (1985)
      - 3319  # Darkwing Duck (1991)
      - 2720  # TaleSpin (1990)
      - 4630  # The Fairly OddParents (2001)
      - 384   # Doug (1991)
      - 4288  # Beetlejuice (1989)
      - 7248  # The Magic School Bus (1994)
      - 2429  # Aaahh!!! Real Monsters (1994)
      - 478   # Captain Planet and the Planeteers (1990)
      - 2567  # Hercules (1998)
      - 3611  # Cow and Chicken (1997)
    summary: "Masked heroes, mad inventions, talking animals, and mysteries best solved with a bowl of cereal. Pajamas encouraged. 🥣"

  Classic Sitcoms:
    template:
      name: shuffle

    #
    # Plex groups both Will & Grace runs under the original show's eleven seasons.
    # That single series match includes the revival without a separate builder.
    #
    tmdb_show:
      - 1668  # Friends (1994)
      - 105   # Sex and the City (1998)
      - 2004  # Malcolm in the Middle (2000)
      - 1678  # The Golden Girls (1985)
      - 3068  # The Golden Palace (1992)
      - 2352  # The Nanny (1993)
      - 4454  # Will & Grace (1998), including the revival seasons in Plex
      - 654   # Reba (2001)
      - 2706  # Roseanne (1988)
    summary: "Chosen families, nosy neighbors, romantic disasters, and friends who always have one more comeback. Save a seat on the sofa. 🛋️"

  Modern Sitcoms:
    template:
      name: shuffle
    tmdb_show:
      - 2316   # The Office (2005)
      - 8592   # Parks and Recreation (2009)
      - 48891  # Brooklyn Nine-Nine (2013)
      - 1421   # Modern Family (2009)
      - 83631  # What We Do in the Shadows (2019)
      - 7777   # Better Off Ted (2009)
      - 1418   # The Big Bang Theory (2007)
      - 61662  # Schitt's Creek (2015)
      - 71728  # Young Sheldon (2017)
      - 62649  # Superstore (2015)
    summary: "Office politics, chaotic families, eccentric friends, and vampires with roommate problems. Nobody here has it entirely together."
