#
# in-progress.yml: Show unfinished series using each viewer's watch history.
#

external_templates:
  default: templates
  template_variables:
    collection_section: "009"

collections:
  #
  # Evaluate the smart collection against the current viewer's playback history.
  #
  TV Shows In Progress:
    variables:
      key: progress_shows
    smart_filter:
      sort_by: viewed.desc
      all:
        unplayed_episodes: true
        episode_plays.gt: 0
    template:
      - name: shared
    collection_filtering: user
    summary: "Unfinished stories and familiar faces waiting for your return. That cliffhanger is not going to resolve itself. ⏯️"
    visible_library: true
    visible_home: true
    visible_shared: true
    sort_title: "!007_In_Progress_TV_Shows"
    file_poster: config/assets/posters/new-releases/tv-shows-in-progress.png
