#
# genre.yml: Build movie genres from Plex tags and named TMDb keywords.
#

templates:
  #
  # Keep custom posters and alphabetical browsing while synchronizing membership.
  #
  genre:
    file_poster: /config/assets/posters/genre/<<poster_id>>.jpg
    sort_title: "!060_<<collection_name>>"
    collection_order: title.asc
    sync_mode: sync

collections:
  #
  # Native genres use library tags without external curated additions.
  # The seasonal Halloween collection is maintained separately.
  #
  Horror Movies:
    template:
      name: genre
      poster_id: Horror
    plex_search:
      all:
        genre: Horror
    schedule: range(11/01-09/14)
    summary: "Nightmares, monsters, and unsettling tales of terror."

  #
  # Each keyword contributes movies independently; matches are combined.
  # Coverage follows TMDb tagging, not a manually maintained title list.
  #
  LGBTQ+ Movies:
    template:
      name: genre
      poster_id: LGBTQ+
    tmdb_keyword:
      - 158718  # LGBT
      - 380747  # LGBT+
      - 363345  # Gay
      - 264386  # Lesbian
      - 329968  # Bisexual
      - 290527  # Transgender
      - 240109  # Intersex
    schedule: weekly(tuesday)
    summary: "Stories of queer love, identity, community, and self-discovery."

  Sports Movies:
    template:
      name: genre
      poster_id: Sport
    tmdb_keyword:
      - 6075    # Sports
      - 333328  # Sport
    schedule: weekly(tuesday)
    summary: "Athletes, fierce rivalries, and the pursuit of victory."

  Spy Movies:
    template:
      name: genre
      poster_id: Spy
    tmdb_keyword:
      - 470   # Spy
      - 5265  # Espionage
    schedule: weekly(tuesday)
    summary: "Secret missions, double agents, and high-stakes espionage."

  Stand-up Comedy:
    template:
      name: genre
      poster_id: Stand-Up Comedy
    tmdb_keyword:
      - 9716  # Stand-up comedy
    schedule: weekly(tuesday)
    summary: "Stand-up performances packed with sharp observations and big laughs."

  War Movies:
    template:
      name: genre
      poster_id: War
    plex_search:
      all:
        genre: War
    schedule: weekly(tuesday)
    summary: "Stories of combat, sacrifice, and lives shaped by war."

  Western Movies:
    template:
      name: genre
      poster_id: Western
    plex_search:
      all:
        genre: Western
    schedule: weekly(tuesday)
    summary: "Frontier adventures, outlaws, and showdowns in the Old West."
