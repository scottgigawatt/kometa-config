#
# weekly-shuffle.yml: Randomize a quality-filtered movie selection without Christmas titles.
#

templates:
  random:
    file_poster: "/config/assets/posters/favorites/Weekly Shuffle.png"
    sort_title: "!058_<<collection_name>>"
    summary: "Unexpected discoveries and familiar favorites for whatever kind of movie night finds you. Popcorn has no genre preference. 🍿"
    sync_mode: sync
    visible_library: true
    visible_home: true
    visible_shared: true
    schedule: weekly(monday)
    limit: 25

collections:
  Weekly Shuffle:
    template:
      name: random
    plex_search:
      all:
        title.not:
          - "`"
          - Christmas
          - Xmas
      sort_by: random

      #
      # Check a bounded random sample, then apply the final 25-item cap after filtering.
      # A smaller eligible pool can produce fewer than 25 picks; never relax the rules.
      #
      limit: 250

    #
    # Include watched and unwatched films with a meaningful number of viewer ratings.
    # Keyword filtering also excludes Christmas stories without Christmas in the title.
    #
    filters:
      tmdb_vote_average.gte: 6
      tmdb_vote_count.gte: 250
      tmdb_keyword.not: christmas
