# new-old.yml: Separate recent releases from older movies newly added.
#

collections:
  #
  # Smart filters follow Plex metadata without waiting for collection rebuilds.
  #
  New Movie Releases:  # Smart collection
    smart_filter:
      sort_by: added.desc
      all:
        added: 92
        release: 365
      limit: 250
    summary: New releases added in the past three months. Sorted by Date Added.
    visible_library: true
    visible_home: true
    visible_shared: true
    sort_title: "!008_New_Releases"
    file_poster: config/assets/posters/new-releases/new-movie-releases.png

  Old Movies Just Added:  # Smart collection
    smart_filter:
      sort_by: added.desc
      all:
        added: 30
        release.not: 365
      limit: 250
    summary: Older releases added in the past month. Sorted by Date Added.
    visible_library: true
    visible_home: true
    visible_shared: true
    sort_title: "!009_Old_Movies_Just_Added"
    file_poster: config/assets/posters/new-releases/old-movies-just-added.png
