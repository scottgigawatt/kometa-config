# top-rated-subgenres.yml: Build ranked movie themes from native provider searches.
#

templates:
  #
  # Keep theme collections hidden, capped at 250 items, and browsable by release.
  #
  ranked_theme:
    file_poster: /config/assets/posters/subgenre_top/subgenre_top_<<poster>>.png
    schedule: weekly(<<day>>)
    collection_mode: hide
    collection_order: release
    delete_not_scheduled: false
    limit: 250
    sort_title: "!061_<<collection_name>>"
    sync_mode: sync
    visible_home: false
    visible_library: false
    visible_shared: false

  #
  # Rank up to 1,000 English-original candidates before matching local movies.
  # Pipe-separated keywords mean OR; comma-separated genres mean AND.
  #
  tmdb_theme:
    default: &rating_defaults
      minimum_rating: 5
      minimum_votes: 1000
    optional:
      - keywords
      - genres
      - excluded_keywords
    tmdb_discover:
      with_keywords: <<keywords>>
      with_genres: <<genres>>
      without_keywords: <<excluded_keywords>>
      with_original_language: en
      vote_average.gte: <<minimum_rating>>
      vote_count.gte: <<minimum_votes>>
      sort_by: vote_average.desc
      limit: 1000

  #
  # Use native IMDb keyword searches where TMDb theme coverage is inadequate.
  # English-language matching also includes multilingual films, unlike TMDb's
  # original-language filter. These searches never reference curated lists.
  #
  imdb_theme:
    default: *rating_defaults
    optional:
      - genre
    imdb_search:
      keyword: <<keyword>>
      genre: <<genre>>
      language: en
      type: movie,tv_movie
      rating.gte: <<minimum_rating>>
      votes.gte: <<minimum_votes>>
      sort_by: rating.desc
      limit: 1000

