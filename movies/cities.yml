#
# cities.yml: City-setting collections with local artwork and TMDb keywords.
#

#
# Use city-setting keywords, not filming locations or individual users' lists.
# TMDb keyword membership determines which movies enter or leave each collection.
#
templates:
  city:
    file_poster: /config/assets/posters/cities/<<city>>.png
    sort_title: "!105_<<collection_name>>"
    collection_order: title.asc
    content_rating: R
    summary: "Big dreams, chance encounters, and trouble around the corner on the streets of <<city>>. 🌆"
    sync_mode: sync
    schedule: weekly(saturday)

collections:
  Chicago Collection:
    template:
      name: city
      city: Chicago
    tmdb_keyword:
      - 520  # Chicago, Illinois

  Detroit Collection:
    template:
      name: city
      city: Detroit
    tmdb_keyword:
      - 18021  # Detroit, Michigan

  Las Vegas Collection:
    template:
      name: city
      city: Las Vegas
    tmdb_keyword:
      - 14570  # Las Vegas

  Los Angeles Collection:
    template:
      name: city
      city: Los Angeles
    tmdb_keyword:
      - 12670  # Los Angeles, California

  New York Collection:
    template:
      name: city
      city: New York
    tmdb_keyword:
      - 242  # New York City

  Washington D.C. Collection:
    template:
      name: city
      city: Washington DC
    tmdb_keyword:
      - 521  # Washington DC, USA
