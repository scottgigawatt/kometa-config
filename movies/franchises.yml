#
# franchises.yml: Release-ordered film collections with custom franchise artwork.
#

#
# TMDb collection IDs follow upstream membership without extra movie overrides.
# Keep the adjacent collection names readable when reviewing numeric IDs.
#
templates:
  franchise:
    file_poster: /config/assets/posters/franchise/<<poster_id>>.jpg
    sort_title: "!106_<<collection_name>>"
    collection_order: release
    sync_mode: sync
    schedule:
      - weekly(sunday)
      - weekly(thursday)

collections:
  After Collection:
    template:
      name: franchise
      poster_id: After
    plex_search:
      all:
        title.begins: After
        actor: Josephine Langford
    summary: "Tessa and Hardin fall hard, fight harder, and discover that chemistry is not the same thing as having your life together. 💔"

  Jurassic Park Collection:
    template:
      name: franchise
      poster_id: Jurassic Park
    tmdb_collection:
      - 328  # Jurassic Park Collection
    summary: "Cloned dinosaurs, spectacular parks, and humanity's persistent refusal to learn from the last dinosaur incident. 🦖"

  American Pie Collection:
    template:
      name: franchise
      poster_id: American Pie
    tmdb_collection:
      - 2806  # American Pie Collection
    summary: "Jim, Michelle, and their friends stumble through sex, growing up, and reunions with very little dignity intact. 🥧"

  Back to the Future Trilogy:
    template:
      name: franchise
      poster_id: BTTF
    plex_search:
      all:
        title.begins: "Back to the Future"
    summary: "Marty McFly and Doc Brown race through Hill Valley's past and future, where one wrong turn can erase the family photo. ⚡"

  Batman Collection:
    template:
      name: franchise
      poster_id: Batman
    tmdb_collection:
      - 120794  # Batman Collection
    summary: "Gotham's caped crusader faces theatrical villains, dangerous romances, and a city with an alarming shortage of daylight. 🦇"

