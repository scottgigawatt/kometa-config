#
# universes.yml: Release-ordered movie universes from native TMDb metadata.
#

#
# Combine native collection groups or universe keywords without standalone films.
# Keep the same minimum and section as the remaining universe Defaults.
#
templates:
  universe:
    file_poster: /config/assets/posters/franchise/<<poster_id>>.jpg
    sort_title: "!106_<<collection_name>>"
    collection_order: release
    sync_mode: sync
    minimum_items: 3

collections:
  Marvel Cinematic Universe:
    template:
      name: universe
      poster_id: Marvel Cinematic Universe
    tmdb_keyword:
      - 180547  # Marvel Cinematic Universe (MCU)
    summary: "Heroes assemble, worlds collide, and saving the universe becomes a team sport with a very complicated group chat. 🦸"

  #
  # The DCEU keyword defines this universe, not every film based on DC comics.
  #
  DC Universe:
    template:
      name: universe
      poster_id: DC Universe
    tmdb_keyword:
      - 229266  # DC Extended Universe (DCEU)
    summary: "Superman, Batman, Wonder Woman, and their allies face impossible choices and world-shaking threats across the DC Extended Universe. ⚡"

  Star Trek Universe:
    template:
      name: universe
      poster_id: Star Trek
    tmdb_collection:
      - 151     # Star Trek: The Original Series Collection
      - 115570  # Star Trek: The Next Generation Collection
      - 115575  # Star Trek: Alternate Reality Collection
    summary: "Starfleet crews venture into the unknown, facing strange worlds, old enemies, and the occasional diplomatic disaster. Boldly, naturally. 🖖"

  Alien / Predator:
    template:
      name: universe
      poster_id: Alien Predator
    tmdb_collection:
      - 8091    # Alien Collection
      - 399     # Predator Collection
      - 115762  # AVP Collection
    summary: "Xenomorphs stalk the dark, Predators hunt for sport, and humanity discovers it is not at the top of the food chain. 👽"

  X-Men Collection:
    template:
      name: universe
      poster_id: X-Men
    tmdb_collection:
      - 748     # X-Men Collection
      - 453993  # The Wolverine Collection
      - 448150  # Deadpool Collection
    summary: "Mutants fight for acceptance and survival, from the X-Men's divided loyalties to Wolverine's claws and Deadpool's complete lack of a filter."
