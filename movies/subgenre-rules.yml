# subgenre-rules.yml: Select themed movies with provider-owned search rules.
#

templates:
  #
  # Select up to 250 matching library movies while retaining release browsing.
  # Keep these collections hidden from home and shared recommendation rows.
  #
  ranked_theme:
    collection_mode: hide
    collection_order: release
    delete_not_scheduled: false
    limit: 250
    sort_title: "!061_<<collection_name>>"
    sync_mode: sync
    visible_home: false
    visible_library: false
    visible_shared: false

  #
  # Default to English-language movies rated at least 5 with 1,000 TMDb votes.
  # Search up to 1,000 candidates before intersecting with this Plex library.
  # Pipe-separated keyword IDs match any keyword, not all keywords together.
  #
  tmdb_theme:
    default:
      minimum_rating: 5
      minimum_votes: 1000
    tmdb_discover:
      with_keywords: <<keywords>>
      with_original_language: en
      vote_average.gte: <<minimum_rating>>
      vote_count.gte: <<minimum_votes>>
      sort_by: vote_average.desc
      limit: 1000

collections:
  #
  # IMDb maintains the mindbender keyword; TMDb has no populated equivalent.
  # This is a keyword search, not an external user's curated list.
  #
  Top Rated in Mindfuck:
    summary: "Mind-bending stories that blur reality and reward a second watch."
    file_poster: /config/assets/posters/subgenre_top/subgenre_top_mindfuck.png
    schedule: weekly(thursday)
    template:
      - name: ranked_theme
    imdb_search:
      keyword: mindbender
      type: movie,tv_movie
      rating.gte: 5
      votes.gte: 1000
      language: en
      sort_by: rating.desc
      limit: 1000

  Top Rated in Outerspace:
    summary: "Journeys beyond Earth, from distant worlds to the depths of space."
    file_poster: /config/assets/posters/subgenre_top/subgenre_top_outerspace.png
    schedule: weekly(thursday)
    template:
      - name: ranked_theme
      - name: tmdb_theme
        keywords: "252634|3801"   # Outer space | Space travel

  Top Rated in Philosophical:
    summary: "Stories exploring existence, morality, and what it means to be human."
    file_poster: /config/assets/posters/subgenre_top/subgenre_top_philosophical.png
    schedule: weekly(friday)
