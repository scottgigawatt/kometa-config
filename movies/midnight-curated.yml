# midnight-curated.yml: Repository-owned film selections for the Midnight Cinema block.
#

#
# Source links document research and editorial inspiration; Kometa never reads them.
# Membership is fixed here; missing movies are requested from Radarr by TMDb movie ID.
# Years identify original premieres, which may precede TMDb's main theatrical date.
#
templates:
  midnight_curated:
    sort_title: "!020_2_<<position>>_<<collection_name>>"
    file_poster: /config/assets/posters/midnight-cinema/<<poster>>.jpg
    sync_mode: sync
    collection_order: release
    minimum_items: 3
    collection_mode: hide
    visible_library: true
    visible_home: true
    visible_shared: true

    #
    # Add missing selections with monitoring and an initial search; retain quality defaults.
    # Cached or existing Radarr entries can be monitored but are not searched again by Kometa.
    #
    radarr_add_missing: true
    radarr_add_existing: false
    radarr_search: true
    radarr_monitor: true
    radarr_monitor_existing: true
    radarr_ignore_cache: true
    radarr_upgrade_existing: false

collections:

  #
