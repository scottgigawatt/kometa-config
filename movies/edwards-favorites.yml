# edwards-favorites.yml: Owner-controlled movie favorites.
#

templates:

  #
  # Synchronize owner-selected favorites and explicitly add and search missing movies.
  # These Radarr overrides are independent of the globally disabled defaults.
  #
  favorites:
    file_poster: /config/assets/posters/favorites/<<poster_id>>.png
    sort_title: "!059_<<collection_name>>"
    collection_order: alpha
    content_rating: R  # Rate the collection itself; do not filter movie ratings.
    sync_mode: sync
    radarr_add_missing: true
    radarr_search: true

collections:

  #
  # Retain the owner's curated list rather than approximating personal favorites with rules.
  #
  Edward's Favorite Movies:
    template:
      name: favorites
      poster_id: Edward's Favorites
    trakt_list:
      - https://trakt.tv/users/scottgigawatt/lists/plex-favorite-movies
    summary: "Edward's beloved rewatches, personal obsessions, and movies worth making everyone else sit down for. Tastefully opinionated. 💅"
