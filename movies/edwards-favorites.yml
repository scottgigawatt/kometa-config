templates:

  #
  # Synchronize owner-selected favorites and explicitly add and search missing movies.
  # These Radarr overrides are independent of the globally disabled defaults.
  #
  favorites:
    file_poster: /config/assets/posters/favorites/<<poster_id>>.png
    sort_title: "!059_<<collection_name>>"
    collection_order: alpha
    content_rating: R  # Rate the collection itself; do not filter movie ratings.
    sync_mode: sync
    radarr_add_missing: true
    radarr_search: true

collections:

  #
  # Maintain personal favorites here, including explicit IDs for missing movies.
