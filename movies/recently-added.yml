#
# recently-added.yml: Separate recent releases from older movies newly added.
#

collections:

  #
  # Smart filters update membership in Plex without waiting for collection rebuilds.
  # New releases must be added within 92 days and released within the last year.
  #
  New Movie Releases:
    smart_filter:
      sort_by: added.desc
      all:
        added: 92
        release: 365
      limit: 250
    summary: "Fresh stories, new faces, and big-screen adventures ready for a first impression. 🍿"
    visible_library: true
    visible_home: true
    visible_shared: true
    sort_title: "!008_New_Releases"
    file_poster: config/assets/posters/new-releases/new-movie-releases.png

  #
  # Separate movies added within 30 days whose release dates are more than a year old.
  #
  Old Movies Just Added:
    smart_filter:
      sort_by: added.desc
      all:
        added: 30
        release.not: 365
      limit: 250
    summary: "Earlier releases with new chances to charm, thrill, or finally escape the 'I'll watch it someday' pile. 🎞️"
    visible_library: true
    visible_home: true
    visible_shared: true
    sort_title: "!009_Old_Movies_Just_Added"
    file_poster: config/assets/posters/new-releases/old-movies-just-added.png
