#
# .gitleaks.toml: Keep the reviewed detect-secrets baseline out of Gitleaks
#                 findings while scanning every source-controlled file.
#

#
# Extend the built-in detectors so a local configuration never disables the
# standard credential rules.
#
[extend]
  useDefault = true

#
# Exclude only the generated detect-secrets baseline at the repository root.
#
[[allowlists]]
  description = "Generated detect-secrets baseline"
  paths = ['''^(\./)?\.secrets\.baseline$''']
