# .gitleaks.toml: Keep the reviewed detect-secrets baseline out of Gitleaks
#                 findings while scanning every source-controlled file.
#

#
# Ignore only the generated secret baseline; repository source remains scanned.
#
[[paths]]
  path = "**/.secrets.baseline"
  ignore = true
