#
# config.yml: Route issue reports, support questions, and security concerns.
#

#
# Prefer focused templates while keeping sensitive reports out of public issues.
#
blank_issues_enabled: false
contact_links:
  - name: Support and setup
    url: https://github.com/scottgigawatt/kometa-config/blob/main/docs/SUPPORT.md
    about: Choose the right route for configuration questions and troubleshooting.
  - name: Report a vulnerability privately
    url: https://github.com/scottgigawatt/kometa-config/security/advisories/new
    about: Do not disclose credentials, private addresses, or vulnerabilities in public issues.
