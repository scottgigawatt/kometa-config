# validate-pr.yml: Validate Kometa configuration and repository quality gates.
#

name: "Screen the Kometa Schedule 📺"

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    name: "Validate the Configuration Reels 🎞️"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: "Check Out the Text Reels 📼"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.md
            /*.yaml
            /*.yml
            /.editorconfig
            /.gitattributes
            /.gitignore
            /.gitleaks.toml
            /.markdownlint-cli2.yaml
            /.prettierignore
            /.prettierrc.json5
            /.secrets.baseline
            /Makefile
            /requirements-dev.txt
            /.github/
            /.vscode/
            /docs/
            /movies/*.yml
            /overlays/*.yml
            /overlays/test/*.yml
            /playlists/*.yml
            /scheduled/*.yml
            /scripts/
            /shows/*.yml
            /tests/

      - name: "Ready the Validation Projector 🎥"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: "Install the Checked Reels 🧰"
        run: python -m pip install --requirement requirements-dev.txt

      - name: "Run the Repository Credits ✅"
        run: make validate check-generated lint-ci
